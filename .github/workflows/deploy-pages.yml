name: Deploy to GitHub Pages

# เปิด Pages ให้อัตโนมัติ + deploy เว็บทุกครั้งที่ push ขึ้น main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# กันไม่ให้ deploy ซ้อนกัน แต่ไม่ตัด run ที่กำลังทำอยู่
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (เปิด Pages ให้อัตโนมัติถ้ายังไม่เปิด)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
