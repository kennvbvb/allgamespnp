name: Game link check

# ตรวจลิงก์เกมทั้งหมดตามเวลา (ทุกวันจันทร์) + เรียกเองได้
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check all game links
        run: node scripts/check-links.mjs
